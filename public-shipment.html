<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بيانات الشحنة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#1877f2;--navy:#082f58;--ink:#102943;--muted:#71879d;--line:rgba(126,164,201,.28);--glass:rgba(255,255,255,.7);--shadow:0 24px 70px rgba(7,31,61,.15),inset 0 1px rgba(255,255,255,.9)}
    @page{size:A4;margin:14mm}*{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:32px;background:radial-gradient(circle at 8% 8%,rgba(90,197,255,.2),transparent 28rem),radial-gradient(circle at 88% 12%,rgba(119,143,255,.14),transparent 32rem),linear-gradient(145deg,#f7fbff,#eaf3fb 52%,#f4f8fd);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}.sheet{width:min(1080px,100%);margin:0 auto;background:var(--glass);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:clamp(24px,4vw,44px);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%)}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{color:var(--navy);font-size:13px;font-weight:700;letter-spacing:.45px}.head h1{margin:7px 0 9px;font-size:clamp(24px,3vw,32px)}.operation{display:inline-flex;align-items:center;background:rgba(227,241,255,.82);border:1px solid rgba(24,119,242,.2);color:var(--primary);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;direction:ltr}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:24px 0}.field{min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.68);box-shadow:inset 0 1px rgba(255,255,255,.9)}.field b{display:block;margin-bottom:6px;color:var(--muted);font-size:11px}.field span{display:block;font-size:14px;font-weight:600;word-break:break-word;direction:auto}.section{margin-top:24px}.section h2{margin:0 0 10px;color:var(--navy);font-size:17px}.note{padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.68);white-space:pre-line;line-height:1.8}.print{border:1px solid rgba(255,255,255,.25);border-radius:11px;padding:11px 17px;background:linear-gradient(135deg,var(--primary),#1462c6);box-shadow:0 9px 22px rgba(24,119,242,.2);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.print:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(24,119,242,.26)}@media(max-width:600px){body{padding:0}.sheet{min-height:100dvh;margin:0;border:0;border-radius:0;padding:20px}.grid{grid-template-columns:1fr}.head{display:block}.print{margin-top:15px}}@media print{body{padding:0;background:#fff}.sheet{max-width:none;margin:0;padding:0;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}.print{display:none}.head{border-bottom-color:#000}.section h2,.brand{color:#000}}
  </style>
  <link rel="stylesheet" href="/brand-theme.css?v=20260911-brand-1">
</head>
<body class="public-shipment-page">
  <main class="sheet" id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const field = (label, value) => value ? `<div class="field"><b>${esc(label)}</b><span>${esc(value)}</span></div>` : '';
    let data = null;
    try {
      const encoded = new URLSearchParams(location.hash.slice(1)).get('d') || '';
      const raw = encoded.startsWith('z') && typeof LZString !== 'undefined'
        ? LZString.decompressFromEncodedURIComponent(encoded.slice(1))
        : decodeURIComponent(escape(atob(encoded.startsWith('b') ? encoded.slice(1) : encoded)));
      data = JSON.parse(raw);
      if (Array.isArray(data)) {
        const [operationNo,status,invoiceNo,invoiceDate,proformaNo,billNo,consignee,consigneeAddress,itemDesc,totalQty,qtyUnit,totalAmount,currency,portLoading,portDischarge,paymentTerm,bankName,bankDetails,notes] = data;
        data = {operationNo,status,invoiceNo,invoiceDate,proformaNo,billNo,consignee,consigneeAddress,itemDesc,totalQty,qtyUnit,totalAmount,currency,portLoading,portDischarge,paymentTerm,bankName,bankDetails,notes};
      }
    } catch (_) {}
    if (!data) {
      document.getElementById('app').innerHTML = '<h1>تعذر قراءة بيانات الشحنة</h1><p>امسح رمز QR من الفاتورة مرة أخرى.</p>';
    } else {
      const title = data.itemDesc || data.operationNo || data.invoiceNo || 'بيانات الشحنة';
      document.title = title + ' | بيانات الشحنة';
      const details = [
        ['رقم العملية',data.operationNo],['حالة الشحنة',data.status],['رقم الفاتورة',data.invoiceNo],['تاريخ الفاتورة',data.invoiceDate],
        ['رقم البروفورما',data.proformaNo],['رقم البوليصة',data.billNo],['العميل / المستلم',data.consignee],['العنوان',data.consigneeAddress],
        ['وصف البضاعة',data.itemDesc],['الكمية',[data.totalQty,data.qtyUnit].filter(Boolean).join(' ')],['القيمة الإجمالية',[data.currency,data.totalAmount].filter(Boolean).join(' ')],
        ['ميناء التحميل',data.portLoading],['ميناء الوصول',data.portDischarge],['شرط الدفع',data.paymentTerm],['البنك',data.bankName],['بيانات البنك',data.bankDetails]
      ].map(([label,value]) => field(label,value)).join('');
      document.getElementById('app').innerHTML = `<header class="head"><div><div class="brand">BAHAR SWAKEN GENERAL TRADING L.L.C</div><h1>${esc(title)}</h1><div class="operation">${esc(data.operationNo || '')}</div></div><button class="print" onclick="window.print()">طباعة البيانات</button></header><section class="grid">${details}</section>${data.notes ? `<section class="section"><h2>ملاحظات</h2><div class="note">${esc(data.notes)}</div></section>` : ''}`;
    }
  </script>
</body>
</html>
